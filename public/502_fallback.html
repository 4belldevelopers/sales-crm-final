<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">
    <title>Updating JERO Application...</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .update-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            padding: 40px 32px;
            max-width: 480px;
            width: 100%;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #009ef7;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 24px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 10px;
        }
        p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #f1f5f9;
            color: #475569;
            font-size: 11px;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 9999px;
            margin-bottom: 24px;
        }
        .btn-reload {
            display: inline-block;
            background-color: #009ef7;
            color: #ffffff;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out;
            text-decoration: none;
        }
        .btn-reload:hover {
            background-color: #0086d4;
        }
    </style>
</head>
<body>
    <div class="update-card">
        <div class="spinner"></div>
        <h1>System Optimizing</h1>
        <p>The JERO application runtime is completing a lightning update. Your session will automatically reconnect in a few seconds.</p>
        <div class="badge">Auto-refreshing in 3s...</div>
        <div>
            <button class="btn-reload" onclick="window.location.reload();">Reconnect Now</button>
        </div>
    </div>
</body>
</html>
