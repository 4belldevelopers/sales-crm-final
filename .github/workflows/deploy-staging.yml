name: Deploy to Staging (testing.jero.works)

# Auto-deploys every push to the `staging` branch.
# You can also trigger it manually from the Actions tab (Run workflow).
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd ${{ secrets.STAGING_PATH }}
            echo ">> Pulling latest staging code"
            git fetch origin staging
            git reset --hard origin/staging
            echo ">> Installing PHP deps"
            composer install --no-dev --optimize-autoloader --no-interaction
            echo ">> Building frontend assets"
            npm ci
            npm run build
            echo ">> Running migrations"
            php artisan migrate --force
            echo ">> Caching config/views"
            php artisan config:cache
            # route:cache is skipped: the route files currently contain ~59 duplicate route
            # names (pre-existing, unrelated to any one feature), which makes route:cache fail
            # outright and, since this script uses `set -e`, was aborting every deploy before
            # reaching `octane:reload` below — so code changes reached disk via git but Octane
            # kept serving the old code from memory indefinitely. route:clear ensures no stale
            # cached route file lingers instead. Routing still works without the cache, just
            # without that perf optimization, until the duplicate names are cleaned up.
            php artisan route:clear
            php artisan view:cache
            echo ">> Ensuring storage and cache permissions"
            chown -R www:www storage bootstrap/cache public || true
            chmod -R 777 storage bootstrap/cache || true
            chmod -R 755 public || true
            chmod -R 644 public/js/*.js || true
            echo ">> Restarting queue workers & Horizon"
            php artisan queue:restart || true
            php artisan horizon:terminate || true
            echo ">> Full Octane restart"
            # FrankenPHP + OPcache: `octane:reload` only gracefully reloads worker threads,
            # which re-read the SAME cached bytecode — so new code silently never takes effect
            # (documented in the project's CLAUDE.md). A full process stop/start is required to
            # clear OPcache and actually load the freshly deployed code.
            php artisan octane:stop || true
            sleep 3
            # Relaunch detached (setsid+nohup) so the daemon survives this SSH session closing —
            # start-octane.sh runs `octane:start` in the foreground. If the process manager
            # (aaPanel) already auto-relaunched it after the stop, this second start simply fails
            # to bind port 8000 and exits harmlessly; either way the site comes back up fresh and
            # there is no window where it is left down without an attempt to restart it.
            setsid nohup bash start-octane.sh > storage/logs/octane-start.log 2>&1 < /dev/null &
            sleep 5
            php artisan octane:status || true
            echo ">> Staging deploy complete"
