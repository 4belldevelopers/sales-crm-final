name: Deploy to Production (hire.jero.works)

# MANUAL ONLY. Production never deploys automatically.
# After staging is verified and you've merged `staging` into `main`,
# go to the Actions tab -> this workflow -> "Run workflow" to deploy.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}
          command_timeout: 30m

          script: |
            set -e

            cd ${{ secrets.PROD_PATH }}

            ###########################################################
            # PATH: appleboy/ssh-action runs a non-login shell, which
            # never sources the profile that puts nvm's node/npm on PATH.
            # Without this, `node`/`npm` are "command not found" here even
            # though they're installed and used fine in a normal SSH login.
            ###########################################################
            export PATH="/www/server/nvm/versions/node/v24.13.1/bin:$PATH"

            ###########################################################
            # ALWAYS BRING SITE BACK ONLINE EVEN IF DEPLOYMENT FAILS
            ###########################################################
            trap 'php artisan up || true' EXIT

            echo "=================================================="
            echo "🚀 JERO PRODUCTION DEPLOYMENT"
            echo "Started: $(date)"
            echo "Server : $(hostname)"
            echo "Path   : $(pwd)"
            echo "=================================================="

            ###########################################################
            # ENVIRONMENT CHECK
            ###########################################################

            echo ""
            echo ">> Checking environment"

            php -v
            composer --version
            node -v
            npm -v

            ###########################################################
            # MAINTENANCE MODE
            ###########################################################

            echo ""
            echo ">> Enabling maintenance mode"

            php artisan down --render="errors::503" || true

            ###########################################################
            # UPDATE SOURCE CODE
            ###########################################################

            echo ""
            echo ">> Updating source code"

            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_production" git fetch origin main

            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_production" git reset --hard origin/main

            # NOTE: intentionally no `git clean -fd` here — this repo's
            # .gitignore excludes .env and storage/app/{public,private}
            # (real uploaded candidate/company files live there). Cleaning
            # untracked files would delete production secrets and live
            # uploads on every deploy. `reset --hard` already syncs every
            # tracked file; nothing further is needed.

            echo ""
            echo ">> Current Commit"

            git log -1 --oneline

            ###########################################################
            # COMPOSER
            ###########################################################

            echo ""
            echo ">> Installing Composer dependencies"

            export COMPOSER_ALLOW_SUPERUSER=1

            composer install \
                --no-dev \
                --prefer-dist \
                --optimize-autoloader \
                --classmap-authoritative \
                --no-interaction

            ###########################################################
            # FRONTEND BUILD
            ###########################################################

            if [ -f package-lock.json ]; then

              echo ""
              echo ">> Installing Node packages"

              # NODE_ENV=production must NOT be set before `npm ci` — every
              # frontend build tool (vite, laravel-vite-plugin, tailwindcss,
              # postcss) lives in devDependencies, and npm skips installing
              # devDependencies entirely when NODE_ENV=production is set,
              # which left `vite` missing and broke the build step below.
              npm ci

              echo ""
              echo ">> Building frontend"

              export NODE_ENV=production

              npm run build

            else

              echo ""
              echo ">> No package-lock.json found. Skipping frontend build."

            fi

            ###########################################################
            # DATABASE
            ###########################################################

            echo ""
            echo ">> Running database migrations"

            php artisan migrate --force

            ###########################################################
            # CACHE
            ###########################################################

            echo ""
            echo ">> Clearing old caches"

            php artisan optimize:clear

            echo ""
            echo ">> Rebuilding caches"

            php artisan config:cache

            # route:cache is skipped: this repo currently has ~59 duplicate
            # route names (pre-existing, unrelated to any one feature),
            # which makes route:cache fail outright and, under `set -e`,
            # would abort the rest of this deploy (queue/horizon/reverb/
            # octane restarts and the health check below would never run).
            # route:clear ensures no stale cached route file lingers
            # instead. Routing still works without the cache, just without
            # that perf optimization, until the duplicate names are
            # cleaned up. Keep this in sync with deploy-staging.yml.
            php artisan route:clear

            php artisan view:cache

            php artisan event:cache || true

            ###########################################################
            # PERMISSIONS
            ###########################################################

            echo ""
            echo ">> Setting storage and cache permissions"

            chown -R www:www storage bootstrap/cache || true
            chmod -R 777 storage bootstrap/cache || true

            ###########################################################
            # RESTART SERVICES
            ###########################################################

            echo ""
            echo ">> Restarting Laravel services"

            php artisan queue:restart || true

            php artisan horizon:terminate || true

            php artisan reverb:restart || true

            echo ""
            echo ">> Full Octane restart"

            # FrankenPHP + OPcache: `octane:reload` only gracefully reloads
            # worker threads, which re-read the SAME cached bytecode — so
            # new code silently never takes effect. A full process
            # stop/start is required to clear OPcache and actually load the
            # freshly deployed code. Same fix as deploy-staging.yml.
            php artisan octane:stop || true
            sleep 3
            setsid nohup bash start-octane.sh > storage/logs/octane-start.log 2>&1 < /dev/null &
            sleep 5
            php artisan octane:status || true

            ###########################################################
            # DISABLE MAINTENANCE MODE
            ###########################################################

            echo ""
            echo ">> Disabling maintenance mode"

            php artisan up

            ###########################################################
            # HEALTH CHECK
            ###########################################################

            echo ""
            echo ">> Running health check"

            curl -fsS https://hire.jero.works > /dev/null

            ###########################################################
            # COMPLETE
            ###########################################################

            echo ""
            echo "=================================================="
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "Finished: $(date)"
            echo "=================================================="
