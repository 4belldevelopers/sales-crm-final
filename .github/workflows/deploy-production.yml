name: Deploy to Production (hire.jero.works)

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT || 22 }}

          script: |
            set -e

            cd ${{ secrets.PROD_PATH }}

            trap 'php artisan up || true' EXIT

            echo ">> Enabling maintenance mode"
            php artisan down --render="errors::503" || true

            echo ">> Pulling latest main code"
            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_production" git fetch origin main
            GIT_SSH_COMMAND="ssh -i /root/.ssh/github_production" git reset --hard origin/main

            echo ">> Installing PHP dependencies"
            export COMPOSER_ALLOW_SUPERUSER=1
            composer install --no-dev --optimize-autoloader --no-interaction

            echo ">> Building frontend assets"
            export NODE_ENV=production
            npm ci
            npm run build

            echo ">> Running migrations"
            php artisan migrate --force

            echo ">> Caching Laravel"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo ">> Reloading Octane"
            php artisan octane:reload

            echo ">> Deployment completed successfully"
